ce":"maintenance worker","role.forager":"forager","role.scout":"scout","role.worker":"worker","roleDesc.queen":"The colony's only reproductive. After her mating flight she shed her wings and founded the nest alone, and she lays eggs for the rest of her life; the sperm stored from that one mating lasts more than a decade.","roleDesc.nurse":"Mostly young workers that emerged recently. They stay inside to care for eggs, larvae and pupae, feed the larvae and the queen, and help new ants out of their cocoons. As they age they gradually move on to work outside the nest.","roleDesc.maintenance":"Middle-aged workers. They dig and extend tunnels, carry waste and dead nestmates out of the nest, and guard and patrol the entrances.","roleDesc.forager":"The oldest workers, doing the riskiest work outside: searching for and carrying food, herding aphids, and laying a trail pheromone on the way home to recruit nestmates. Scouts are more inclined to explore unknown areas.","chamber.queen":"queen chamber","chamber.egg":"egg chamber","chamber.larva":"larva chamber","chamber.pupa":"pupa chamber","chamber.solar":"solar nursery","chamber.food":"food store","chamber.waste":"waste chamber","chamber.rest":"rest chamber","chamber.winter":"wintering chamber","chamber.numbered":"{name} {n}","chamberDesc.queen":"Home of the colony's only reproductive. A black garden ant queen can live for more than 20 years; nurses feed and clean her while she keeps laying eggs.","chamberDesc.egg":"Nurses gather the queen's eggs into clusters and keep licking them to keep them moist and stop mold.","chamberDesc.larva":"Larvae have no legs and depend entirely on nurses feeding them prey fragments and regurgitated liquid. What a larva eats decides how big it will be as an adult.","chamberDesc.pupa":"Fully grown black garden ant larvae spin a silk cocoon and pupate. Pupae prefer warm, dry conditions and are often moved to rooms near the surface during the day.","chamberDesc.solar":'A shallow room pressed right under a stone. The stone soaks up sunlight and heats quickly, so in the afternoon nurses move the pupae here to "sunbathe" and develop faster, then carry them back down when it cools at night.',"chamberDesc.food":`Temporary storage for prey fragments and seeds brought back by foragers. Liquid food such as honeydew is mostly stored in the workers' crops (the "social stomach").`,"chamberDesc.waste":"Food scraps, cocoon shells and droppings are piled here first, then carried by maintenance workers to the midden outside, which limits the spread of pathogens inside the nest.","chamberDesc.rest":'Workers with no current task gather here to rest. This "reserve labor force" is mobilized when the colony needs it.',"chamberDesc.winter":"The deepest part of the nest, with a stable temperature all year round. In autumn and winter the whole colony moves in here and goes dormant.","entrance.main":"main entrance","entrance.side":"side entrance","loc.surface":"surface","loc.shaft":"main shaft","loc.tunnel":"tunnel","loc.entrance":"entrance","place.nearEntrance":"beside the nest entrance","place.dir":"{d} cm {dir} of the nest","dir.0":"east","dir.1":"southeast","dir.2":"south","dir.3":"southwest","dir.4":"west","dir.5":"northwest","dir.6":"north","dir.7":"northeast","item.egg":"egg","item.larva":"larva","item.pupa":"pupa","item.food":"food","item.waste":"waste","item.soil":"soil pellet","item.corpse":"dead nestmate","foodKind.prey":"prey pieces","foodKind.seed":"seeds","foodKind.sugar":"sugary liquid","food.beetle":"beetle carcass","food.caterpillar":"caterpillar carcass","food.seeds":"seeds with elaiosomes","food.fruit":"fallen fruit juice","food.syrup":"sugar water","foodDesc.beetle":"Protein-rich prey. Foragers cut it into small pieces and carry them home, mainly to feed the larvae.","foodDesc.caterpillar":"Large, soft-bodied prey. It usually takes many foragers taking turns to cut it up and carry it away, which builds a clear pheromone trail.","foodDesc.seeds":'Seeds of violets and similar plants carry a fat-rich elaiosome that "hires" ants to disperse them. The ants eat the elaiosome and then discard the seed outside the nest.',"foodDesc.fruit":"A sugar-rich liquid food. Foragers suck the juice into their crops, bring it home, and share it with nestmates through trophallaxis.","foodDesc.syrup":'A drop of sugar water from you. Like honeydew and nectar, it is sucked into the crop and carried home; it is the most common "snack" for pet ants.',"predator.spider":"wolf spider","predator.antlion":"antlion","predatorDesc.spider":"A hunting spider of the family Lycosidae. It builds no web; it finds prey by sight and ground vibration and pounces with a sudden dash. Foragers on the surface are common prey. It injects venom, sucks out the body fluids and leaves an empty husk.","predatorDesc.antlion":"The larva of an antlion lacewing (Myrmeleontidae). Walking backwards, it digs a funnel-shaped pit in dry, loose ground and buries itself at the bottom with only its jaws showing. Ants that step on the pit wall slide down the loose sand, and the deeper they go the harder it is to climb out. Caught ants are sucked dry and the husks are flicked out of the pit.","spiderState.wander":"Wandering, looking for prey","spiderState.pause":"Crouched motionless, sensing vibrations","spiderState.chase":"Pouncing on an ant","spiderState.feed":"Feeding","spiderState.leave":"Full, leaving the area","obstacle.pebble":"pebble","obstacle.rock":"big rock","obstacle.twig":"twig barrier","weather.heavyRain":"Heavy rain","weather.lightRain":"Light rain","weather.overcast":"Clouding over","weather.afterRain":"After rain","weather.clear":"Clear","cause.age":"old age","cause.starve":"starvation","cause.spider":"eaten by a wolf spider","cause.mobbed":"bitten to death while mobbing a wolf spider","cause.antlion":"caught in an antlion pit","act.idle":"Standing by","act.dead":"Dead ({cause})","act.solicit":s=>`${js(s.reason)}; begging food from #${s.id}`,"act.receiveShare":"Trophallaxis moved"},Ag={zh:{"toast.loadFailed":"存档无法读取，已开始新的蚁群","toast.problem":"{problem}，已开始新的蚁群","toast.selectFollowable":"先选中一只蚂蚁","toast.confirmNew":"重新开始会删除当前存档，用一个新的蚁群从头开始。确定吗？","toast.bgOn":"后台运行已开启：离开页面后蚁群继续生活","toast.bgResumed":"你不在的时候，蚁群从 {from} 生活到了 {to}","toast.bgLimited":"手机和平板的浏览器切到后台会冻结页面，离开时蚁群会暂停，回来后接着生活；想让它一直过日子，就让页面停在前台","toast.bgFrozen":"页面在后台被浏览器冻结了约 {n} 分钟，这段时间蚁群暂停了","ui.backgroundTitle":"开启时，最小化浏览器或切到其他标签页后蚁群继续生活；关闭时离开页面就暂停","ui.backgroundLimitedTitle":"手机和平板的浏览器切到后台会冻结页面，离开时蚁群会暂停"},en:{"toast.loadFailed":"Couldn't read the save; started a new colony","toast.problem":"{problem}; started a new colony","toast.selectFollowable":"Select an ant first","toast.confirmNew":"Starting over deletes the current save and begins a new colony from scratch. Continue?","toast.bgOn":"Background running on: the colony keeps living when you leave the page","toast.bgResumed":"While you were away the colony lived on from {from} to {to}","toast.bgLimited":"Phone and tablet browsers freeze pages in the background, so the colony pauses while you are away and carries on when you return. Keep the page open to let it live","toast.bgFrozen":"The browser froze the page for about {n} min; the colony was paused meanwhile","ui.backgroundTitle":"When on, the colony keeps living while the browser is minimized or another tab is open; when off, the game pauses as you leave the page","ui.backgroundLimitedTitle":"Phone and tablet browsers freeze pages in the background, so the colony pauses while you are away"}},Cg={"app.title":"赛博养蚂蚁","app.subtitle":"黑毛蚁 Lasius niger","app.loading":"正在生成蚁穴与觅食环境…","role.queen":"蚁后","role.nurse":"保育蚁","role.maintenance":"内务蚁","role.forager":"觅食蚁","role.scout":"侦察蚁","role.worker":"工蚁","roleDesc.queen":"蚁群唯一的繁殖者。婚飞交配后脱落翅膀、独自建巢，此后终生产卵；交配时储存的精子可使用十余年。","roleDesc.nurse":"多为羽化不久的年轻工蚁，留在巢内照料卵、幼虫和蛹，喂养幼虫与蚁后，帮助新蚁破茧。随年龄增长会逐渐转向巢外工作。","roleDesc.maintenance":"中年工蚁，负责挖掘扩建隧道、把垃圾和同伴尸体运出巢外、在巢口警戒巡逻。","roleDesc.forager":"年长工蚁，承担风险最高的巢外工作：搜索并搬运食物、放牧蚜虫，返巢时沿途释放路径信息素招募同伴。侦察蚁更倾向于探索未知区域。","chamber.queen":"蚁后室","chamber.egg":"卵室","chamber.larva":"幼虫室","chamber.pupa":"蛹室","chamber.solar":"向阳育幼室","chamber.food":"储食室","chamber.waste":"垃圾室","chamber.rest":"工蚁休息室","chamber.winter":"越冬室","chamber.numbered":"{name} {n}","chamberDesc.queen":"蚁群唯一的繁殖个体居住于此。黑毛蚁蚁后寿命可达 20 年以上，由保育蚁喂食、清洁，持续产卵。","chamberDesc.egg":"保育蚁把蚁后产下的卵聚成卵团，不断舔舐以保持湿润、抑制霉菌。","chamberDesc.larva":"幼虫无足，完全依赖保育蚁喂食猎物碎块与反刍液。幼虫期获得的营养决定其成年后的体型。","chamberDesc.pupa":"黑毛蚁老熟幼虫吐丝结茧化蛹。蛹偏好较温暖干燥的环境，白天常被搬到靠近地表的房间。","chamberDesc.solar":"紧贴在石块下方的浅层房间。石块白天吸收阳光、升温很快，保育蚁会在午后把蛹搬到这里“晒暖”加速发育，夜间降温后再搬回深处。","chamberDesc.food":"暂存觅食蚁带回的猎物碎块与种子。蜜露等液体食物主要储存在工蚁的嗉囊（“社会胃”）中。","chamberDesc.waste":"食物残渣、茧壳与排泄物先在此堆放，再由内务蚁搬到巢外垃圾堆，以降低病原体在巢内传播的风险。","chamberDesc.rest":"暂时没有任务的工蚁在此聚集休息。这些“后备劳动力”会在蚁群需要时被动员。","chamberDesc.winter":"位于蚁穴最深处，温度全年稳定。秋冬季整个蚁群会迁入这里进入滞育状态。","entrance.main":"主入口","entrance.side":"侧入口","loc.surface":"地表","loc.shaft":"主竖井","loc.tunnel":"隧道","loc.entrance":"入口","place.nearEntrance":"蚁穴入口旁","place.dir":"蚁穴{dir} {d} cm 处","dir.0":"东","dir.1":"东南","dir.2":"南","dir.3":"西南","dir.4":"西","dir.5":"西北","dir.6":"北","dir.7":"东北","item.egg":"卵","item.larva":"幼虫","item.pupa":"蛹","item.food":"食物","item.waste":"垃圾","item.soil":"土粒","item.corpse":"同伴尸体","foodKind.prey":"猎物碎块","foodKind.seed":"种子","foodKind.sugar":"甜液","food.beetle":"甲虫尸体","food.caterpillar":"毛虫尸体","food.seeds":"带油质体的种子","food.fruit":"落果甜汁","food.syrup":"糖水","foodDesc.beetle":"富含蛋白质的猎物。觅食蚁把它肢解成小块搬回巢，主要用于喂养幼虫。","foodDesc.caterpillar":"较大的软体猎物，往往需要很多觅食蚁轮流切割搬运，会形成明显的信息素路径。","foodDesc.seeds":"堇菜等植物的种子附有富含脂肪的油质体，专门“雇佣”蚂蚁传播种子。蚂蚁吃掉油质体后会把种子丢弃到巢外。","foodDesc.fruit":"富含糖分的液体食物。觅食蚁把甜汁吸入嗉囊带回巢，再通过交哺分给同伴。","foodDesc.syrup":"玩家滴下的一滴糖水。和蜜露、花蜜一样被吸进嗉囊带回巢，是饲养蚂蚁最常用的“零食”。","predator.spider":"狼蛛","predator.antlion":"蚁狮","predatorDesc.spider":"狼蛛科（Lycosidae）的游猎型蜘蛛，不结网，靠视觉和地面振动发现猎物，突然冲刺扑击。地表的觅食蚁是它常见的猎物。抓到后注入毒液、吸食体液，留下空壳。","predatorDesc.antlion":"蚁蛉（Myrmeleontidae）的幼虫。它在干燥松软的地面倒退着挖出漏斗形的坑，自己埋在坑底只露出大颚。蚂蚁踩到坑壁会顺着松沙滑下去，越往下越难爬出来；被抓住后体液被吸干，空壳会被蚁狮甩出坑外。","spiderState.wander":"四处游荡，寻找猎物","spiderSta
