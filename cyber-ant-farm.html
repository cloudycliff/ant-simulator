lays eggs for the rest of her life; the sperm stored from that one mating lasts more than a decade.","roleDesc.nurse":"Mostly young workers that emerged recently. They stay inside to care for eggs, larvae and pupae, feed the larvae and the queen, and help new ants out of their cocoons. As they age they gradually move on to work outside the nest.","roleDesc.maintenance":"Middle-aged workers. They dig and extend tunnels, carry waste and dead nestmates out of the nest, and guard and patrol the entrances.","roleDesc.forager":"The oldest workers, doing the riskiest work outside: searching for and carrying food, herding aphids, and laying a trail pheromone on the way home to recruit nestmates. Scouts are more inclined to explore unknown areas.","chamber.queen":"queen chamber","chamber.egg":"egg chamber","chamber.larva":"larva chamber","chamber.pupa":"pupa chamber","chamber.solar":"solar nursery","chamber.food":"food store","chamber.waste":"waste chamber","chamber.rest":"rest chamber","chamber.winter":"wintering chamber","chamber.numbered":"{name} {n}","chamberDesc.queen":"Home of the colony's only reproductive. A black garden ant queen can live for more than 20 years; nurses feed and clean her while she keeps laying eggs.","chamberDesc.egg":"Nurses gather the queen's eggs into clusters and keep licking them to keep them moist and stop mold.","chamberDesc.larva":"Larvae have no legs and depend entirely on nurses feeding them prey fragments and regurgitated liquid. What a larva eats decides how big it will be as an adult.","chamberDesc.pupa":"Fully grown black garden ant larvae spin a silk cocoon and pupate. Pupae prefer warm, dry conditions and are often moved to rooms near the surface during the day.","chamberDesc.solar":'A shallow room pressed right under a stone. The stone soaks up sunlight and heats quickly, so in the afternoon nurses move the pupae here to "sunbathe" and develop faster, then carry them back down when it cools at night.',"chamberDesc.food":`Temporary storage for prey fragments and seeds brought back by foragers. Liquid food such as honeydew is mostly stored in the workers' crops (the "social stomach").`,"chamberDesc.waste":"Food scraps, cocoon shells and droppings are piled here first, then carried by maintenance workers to the midden outside, which limits the spread of pathogens inside the nest.","chamberDesc.rest":'Workers with no current task gather here to rest. This "reserve labor force" is mobilized when the colony needs it.',"chamberDesc.winter":"The deepest part of the nest, with a stable temperature all year round. In autumn and winter the whole colony moves in here and goes dormant.","entrance.main":"main entrance","entrance.side":"side entrance","entrance.third":"third entrance","loc.surface":"surface","loc.shaft":"main shaft","loc.tunnel":"tunnel","loc.entrance":"entrance","place.nearEntrance":"beside the nest entrance","place.dir":"{d} cm {dir} of the nest","dir.0":"east","dir.1":"southeast","dir.2":"south","dir.3":"southwest","dir.4":"west","dir.5":"northwest","dir.6":"north","dir.7":"northeast","item.egg":"egg","item.larva":"larva","item.pupa":"pupa","item.food":"food","item.waste":"waste","item.soil":"soil pellet","item.corpse":"dead nestmate","foodKind.prey":"prey pieces","foodKind.seed":"seeds","foodKind.sugar":"sugary liquid","food.beetle":"beetle carcass","food.caterpillar":"caterpillar carcass","food.seeds":"seeds with elaiosomes","food.fruit":"fallen fruit juice","food.syrup":"sugar water","foodDesc.beetle":"Protein-rich prey. Foragers cut it into small pieces and carry them home, mainly to feed the larvae.","foodDesc.caterpillar":"Large, soft-bodied prey. It usually takes many foragers taking turns to cut it up and carry it away, which builds a clear pheromone trail.","foodDesc.seeds":'Seeds of violets and similar plants carry a fat-rich elaiosome that "hires" ants to disperse them. The ants eat the elaiosome and then discard the seed outside the nest.',"foodDesc.fruit":"A sugar-rich liquid food. Foragers suck the juice into their crops, bring it home, and share it with nestmates through trophallaxis.","foodDesc.syrup":'A drop of sugar water from you. Like honeydew and nectar, it is sucked into the crop and carried home; it is the most common "snack" for pet ants.',"predator.spider":"wolf spider","predator.antlion":"antlion","ladybug.name":"ladybird","predatorDesc.spider":"A hunting spider of the family Lycosidae. It builds no web; it finds prey by sight and ground vibration and pounces with a sudden dash. Foragers on the surface are common prey. It injects venom, sucks out the body fluids and leaves an empty husk.","predatorDesc.antlion":"The larva of an antlion lacewing (Myrmeleontidae). Walking backwards, it digs a funnel-shaped pit in dry, loose ground and buries itself at the bottom with only its jaws showing. Ants that step on the pit wall slide down the loose sand, and the deeper they go the harder it is to climb out. Caught ants are sucked dry and the husks are flicked out of the pit.","spiderState.wander":"Wandering, looking for prey","spiderState.pause":"Crouched motionless, sensing vibrations","spiderState.chase":"Pouncing on an ant","spiderState.feed":"Feeding","spiderState.leave":"Full, leaving the area","obstacle.pebble":"pebble","obstacle.rock":"big rock","obstacle.twig":"twig barrier","weather.heavyRain":"Heavy rain","weather.lightRain":"Light rain","weather.overcast":"Clouding over","weather.afterRain":"After rain","weather.clear":"Clear","cause.age":"old age","cause.starve":"starvation","cause.spider":"eaten by a wolf spider","cause.mobbed":"bitten to death while mobbing a wolf spider","cause.antlion":"caught in an antlion pit","act.idle":"Standing by","act.dead":"Dead ({cause})","act.solicit":i=>`${Qs(i.reason)}; begging food from #${i.id}`,"act.receiveShare":"Trophallaxis with #{id}: receiving regurgitated sugar","act.seekPartner":"Looking for a nestmate that needs food","act.approachShare":"Walking to #{id} to share food","act.giv ked ants walk along it to the end and go around, and the pheromone trail reroutes with them.","info.rockDesc":"Ants don't climb over stones; they follow the edge around. A big rock makes passing ants take a noticeable detour.","info.obstacle":"Obstacle","info.obstacleGone":"It has been removed.","info.puddle":"Puddle","info.puddleDesc":"Ants walk around standing water. Water washes away trail pheromones and footprints, so foragers that were following a trail have to search again. It evaporates faster when it's warmer.","info.radius":"Radius","info.waterLeft":"Water left","info.puddleGone":"It has evaporated and soaked into the soil.","info.predator":"Predator","info.predatorGone":"It has left.","info.putTag":"released by you","info.mobbed":i=>`Being mobbed by ${i.n} ${Dt(i.n,"worker","workers")}`,"info.fleeing":"Driven off by workers, fleeing","info.canEat":"Can still eat","info.harass":"Bitten","info.antlionFeeding":"Feeding ({n} s left)","info.antlionWaiting":"Buried at the bottom of its pit, waiting","info.caught":"Ants caught","info.fillPit":"Fill in the pit","info.antDead":"This ant has died. Maintenance workers will carry its body out to the midden.","info.willBecome":i=>`becoming ${xi(i.role)} ${i.role}`,"info.depth":" ({n} cm deep)","info.onStem":" (on a plant stem)","info.noLog":"Nothing yet","info.activity":"Doing","info.location":"Location","info.antTemp":"Temperature","info.age":"Age","info.queenAge":"about 3 years","info.antAge":"{age} days / expected lifespan {life} days","info.length":"Body length","info.carry":"Carrying","info.crop":"Crop","info.fed":"Fed","info.health":"Health","info.social":"Social","info.socialVal":i=>`${i.c} antenna ${Dt(i.c,"contact","contacts")} · ${i.s} food ${Dt(i.s,"share","shares")}`,"info.delivered":"Food delivered","info.herd":"Herding","info.herdVal":"Tends a colony of about {n} aphids","info.recent":"Recent activity","info.eggs":"Eggs","info.larvae":"Larvae","info.larvaeVal":"{n} ({h} hungry)","info.pupae":"Pupae","info.pupaeVal":"{n} ({r} ready to emerge)","info.food":"Food","info.waste":"Waste","info.corpses":"Corpses","info.contents":"Contents","info.empty":"empty","info.pupaTarget":"Pupae","info.pupaHere":"Nurses are gathering the pupae here","info.pupaElsewhere":"The pupae are kept elsewhere for now","info.digProgress":"Digging","info.enlargeProgress":"Enlarging","info.building":"being dug","info.enlarging":"being enlarged","info.underStone":" This room sits right under a big stone.","info.depthLabel":"Depth","info.size":"Size","info.enlargedTimes":i=>` (enlarged ${i.n} ${Dt(i.n,"time","times")})`,"info.temp":"Temperature","info.stoneBonus":" (stone +{t}°C)","info.humidity":"Humidity","info.wet":"Flooding","info.floodedNote":" (flooded: pupae get moved out and stored food spoils faster)","info.antsInRoom":"Ants in this room","info.flyRoom":"Fly to room","info.plant":"Herb","info.plantDesc":"Ants climb plant stems and leaves looking for small prey and extrafloral nectaries. Black garden ants especially like tending the aphids that cluster on young stems, for the honeydew they excrete.","info.aphids":"Aphid colony","info.hostPlant":"host plant","info.aphidDesc":'Aphids suck plant sap and excrete the extra sugar as honeydew. Black garden ants "milk" them by stroking them with their antennae, and in return drive off ladybirds, lacewings and other enemies, so tended aphid colonies grow faster. Honeydew is the main source of sugar for black garden ants.',"info.aphidCount":"Aphids","info.aboutN":"about {n}","info.honeydew":"Honeydew","info.undiscovered":"Not yet found by the ants","info.tended":"Being tended","info.untended":"Nobody tending it right now","info.onPlant":"Ants on the stem","info.herders":"Regular herders","info.collected":"Collected so far","info.aphidsDispersing":"Crowded; winged aphids are flying off","info.ladybug":"Ladybird","info.ladybugArriving":"Flying in","info.ladybugEating":i=>`Eating aphids (${i.n} so far)`,"info.ladybugChased":i=>`Being chased by ${i.n} ${Dt(i.n,"worker","workers")}`,"info.ladybugLeaving":"Full, flying off","info.ladybugDriven":"Driven off by the ants, flying away","info.eatenByLadybugs":"Eaten by ladybirds","info.foodSource":"Food source","info.foodGone":"This food source has been carried away completely.","info.droppedTag":"dropped by you","info.foodType":"Food type","info.left":"Left","info.leftVal":"{a} / {b} units","info.discovered":"Found","info.notDiscovered":"Not found yet","info.nearAnts":"Ants nearby","info.taken":"Carried away","info.entranceTitle":i=>`${Qs(i.ent)} and mound`,"info.entranceDesc":"Black garden ants pile excavated soil around the entrance into a small crater-shaped mound. The mound keeps rain out and soaks up sunlight to warm the shallow nurseries. A nest usually has several entrances for ventilation and escape. Before rain, maintenance workers plug the entrances from inside with soil pellets so water can't flood the shallow rooms, and clear them once the ground has dried.","info.sealed":"Sealed with soil","info.sealing":"Sealing {n}%","info.open":"Open","info.nearEntrance":"Ants near the entrance","info.moundSoil":"Soil pellets on the mound","info.soilTotal":"Total soil dug","info.flyEntrance":"Fly to entrance","info.midden":"Midden","info.middenDesc":"Workers pile food scraps, cocoon shells and dead nestmates at a fixed spot outside the nest, away from the brood, to limit the spread of pathogens. Workers that carry waste usually never go back to work in the nurseries.","info.removedTotal":"Total removed","notes.title":"Ant notebook","notes.group.nest":"The nest","notes.group.workers":"Who does what","notes.group.forage":"Food and sharing","notes.group.aphids":"Aphids and ladybugs","notes.group.weather":"Weather and warmth","notes.group.threats":"Enemies","notes.group.real":"Real ants","note.nest.title":"A colony of black garden ants","note.nest.body":`The black garden ant (Lasius niger) is one of Europe's most common ants, living under stones in lawns, verges and gardens; in East Asia its close look-alike relatives are common. Workers are only 3–5 mm long. There is one queen and no soldiers, so the workers defend the nest too.
The two little mounds on the ground are soil they dug out; below are tunnels and chambers. Select an ant, a chamber or some food to see what it is and what it's doing. Turn on X-ray to look underground.
A mature wild colony often has thousands to over ten thousand workers. This one has about 1,000.`,"note.nest.hint":"Shown when you start","note.xray.title":"The nest underground","note.xray.body":`X-ray shows the whole nest: a shaft linking layers of chambers. The queen lives in the queen's chamber; eggs, larvae and pupae are kept apart by stage; the food store holds prey and seeds brought home, the waste chamber holds scraps, and there are rest rooms and a winter chamber.
Ants move the brood for warmth and moisture: pupae like it warm, so on sunny days they are carried up to the shallow sun chamber.
Real nests are less tidy. Chamber size and depth change with the soil, the season and the size of the colony, and in winter the ants retreat to depths that don't freeze.`,"note.xray.hint":"Turn on X-ray, or move the camera below ground","note.queen.title":"The queen","note.queen.body":`Only the queen lays eggs. Every worker is her daughter, a female that never mates, so the thousand ants in the nest are one big family.
The queen hardly leaves her chamber. Nurses feed and groom her and carry her eggs to the egg chamber. A hungry queen lays fewer eggs.
In real Lasius niger, workers in a queenless nest can lay unfertilized eggs, which hatch into males (there are no males in the game).`,"note.queen.hint":"Click the queen or the queen's chamber","note.brood.title":"Eggs, larvae and pupae","note.brood.body":`Ants go through complete metamorphosis, like butterflies: eggs hatch into white, legless larvae; a well-fed larva spins a cocoon and pupates; the adult forms inside. Lasius niger cocoons are pale brown and often mistaken for "ant eggs".
Larvae can't find food themselves. Nurses feed them sweet liquid mouth to mouth and give them bits of prey, and workers help each new ant tear open its cocoon.
In real life an egg takes one to two months to become a worker, faster when warm. The game squeezes it into about 8 game days.`,"note.brood.hint":"Click an egg, larva or pupa chamber","note.expand.title":"Expanding the nest","note.expand.body":`When the ants outgrow their rooms, maintenance workers start digging: first a new tunnel, then a chamber opened out from its end. Each soil pellet is carried out and dropped on the mound by the entrance.
Studies of Lasius niger found that nest size roughly tracks the number of workers: they dig when crowded and stop when there's room, with no one in charge.
The Nest section of the colony panel shows how crowded it is and what is being dug.`,"note.expand.hint":"When the nest gets crowded (see crowding in the colony panel)","note.midden.title":"The midden","note.midden.body":`Leftover prey, empty cocoons and dead nestmates are all cleared away: first to the waste chamber inside, then to the midden outside.
Rubbish left in the nest grows mould and germs, so ants keep it far from the brood. Leafcutter ants even have dedicated waste workers that never go back to the brood areas, so they can't carry germs in.`,"note.midden.hint":"Click the midden outside, or the waste chamber","note.roles.title":"Jobs by age","note.roles.body":`A worker changes jobs as she ages: newly emerged, she stays in to tend eggs and larvae (a nurse); later she does housework, cleaning, digging, carrying waste and guarding (maintenance); last of all she goes out to forage (a forager).
Outside there are predators and it's easy to get lost, so leaving the riskiest work to old ants near the end of their lives costs the colony least.
It isn't a fixed rule: when foragers run short, younger workers go out early. Turn on Role colors to color ants by job: pink nurses, blue maintenance, green foragers, orange queen.`,"note.roles.hint":"Turn on Role colors, or click both a nurse and a forager","note.nurse.title":"Nurses","note.nurse.body":`The youngest workers, who rarely leave the nest. They feed the larvae and the queen, lick eggs, larvae and pupae clean (their saliva holds mould back), move pupae to the right temperature and help new ants out of their cocoons.
The colony panel shows how many nurses there are and how many the colony wants.`,"note.nurse.hint":"Click a nurse (pink with role colors)","note.maintenance.title":"Maintenance workers","note.maintenance.body":"Middle-aged workers: they clean chambers, carry out rubbish and the dead, dig tunnels and enlarge rooms; they plug the entrances with soil before rain and clear them afterwards; and they come out to guard the entrance when a spider is near.","note.maintenance.hint":"Click a maintenance worker (blue with role colors)","note.forager.title":"Foragers","note.forager.body":`The oldest workers, out most of the time: finding food, cutting up prey, sipping sweet juice, tending aphids. Coming home with food they lay a pheromone trail, and with a full crop they share the sugar with nestmates inside.
Click one to read about its trip, and pick Follow to go along with it.`,"note.forager.hint":"Click a forager (green with role colors)","note.scout.title":"Scouts","note.scout.body":`A few foragers ignore the trails and wander about looking for new food. These are scouts. When one finds something, it lays a trail home and rouses its nestmates.
After rain, while the ground is still damp, it's the scouts that go out first to check; the rest wait inside.`,"note.scout.hint":"Click a scout (the colony panel shows how many there are)","note.shift.title":"Changing jobs early","note.shift.body":`When foragers are lost (eaten by a spider, caught in an antlion's pit) and there aren't enough to bring food in, some younger workers switch to foraging early.
In real colonies no one gives orders; each ant changes jobs by what it runs into, such as how long since it met a nestmate returning with food. The game simplifies this to working out from the colony's stores how many of each job there should be.`,"note.shift.hint":"When foragers run short (the event log says so)","note.trail.title":"Pheromone trails","note.trail.body":`A forager that has found food dabs a trail pheromone on the ground with the tip of its abdomen all the way home. Nestmates follow the scent, and those that find food add to it on the way back, so a busy trail grows stronger; once no one uses it, it halves in a minute or two.
Short, easy routes are walked faster and topped up more often, so they get stronger while long ones fade. That's how a colony with no leader still finds a short path.
Turn on the Pheromones view: yellow-orange is the food trail, blue is the territory scent, red rings are alarm.`,"note.trail.hint":"Turn on the Pheromones view, or wait for a forager to find food","note.memory.title":"Remembering the way","note.memory.body":`Lasius niger foragers have good memories: after a trip or two to a food source, they can walk straight back without following the scent. In experiments where the trail was bent off to one side, experienced foragers mostly kept to the route they remembered.
Pheromone mainly helps nestmates that have never been there; memory makes the old hands faster.`,"note.memory.hint":"Watch a forager heading to a remembered food spot","note.share.title":"The social stomach","note.share.body":`An ant's crop works like a shared stomach: foragers bring sweet juice and honeydew home in it, then pass a drop mouth to mouth to a nestmate, who passes it on again. This is called trophallaxis.
Food spreads through the whole nest this way, along with scents and other chemical signals. "Social stomach" in the colony panel is the sugar in all the ants' crops added together.`,"note.share.hint":"Watch two ants share food (most often near the food store)","note.prey.title":"Cutting up prey","note.prey.body":`A dead beetle or caterpillar is too big for one ant, so the ants cut it into small pieces with their mandibles on the spot and carry them back to the food store one by one.
Prey is protein, mostly for the growing larvae and the egg-laying queen; adult workers run mainly on sugar.`,"note.prey.hint":"Click a dead beetle or caterpillar, or watch ants cutting one up","note.seeds.title":"Seeds with a snack","note.seeds.body":`Many plants' seeds carry a small, oily appendage rich in fat, called an elaiosome. Ants carry the whole seed home, eat the elaiosome and throw the seed on the midden.
That moves the seed away from its parent to a rich spot to sprout. Violets and greater celandine are planted by ants this way. The plant pays in food, the ants do the sowing, and both gain.`,"note.seeds.hint":"Click some seeds with elaiosomes","note.feed.title":"Putting out food","note.feed.body":`Click the ground to put food down. Sugar water and fruit juice are sucked into the crop and carried home, dead beetles and caterpillars are cut up and carried off, and seed elaiosomes get eaten too.
A scout or forager has to bump into the food before a trail leads the others to it, so food placed far away may take a while.`,"note.feed.hint":"Pick the Food tool","note.obstacle.title":"Blocking the trail","note.obstacle.body":`Drop a twig across a trail and the ants mill about at first, going every which way. The few that get round mark a new route, and before long everyone takes the shortest way round.
It's much like a famous experiment: give ants a long bridge and a short bridge between nest and food, and they soon crowd onto the short one, because the round trip is quicker there and the pheromone builds up faster.`,"note.obstacle.hint":"Pick the Obstacle tool","note.aphids.title":"Herding aphids","note.aphids.body":`Aphids suck plant sap and give off sugary honeydew. Black garden ants are famous herders: they climb the plant, stroke the aphids with their antennae, catch the honeydew and take it home to share.
In return the ants chase off ladybugs, lacewing larvae and other enemies, and tended aphids multiply faster. Some ants even carry aphid eggs into the nest for the winter.
The colony panel shows how many aphid groups have been found.`,"note.aphids.hint":"Wait for a forager to find aphids (on the herbs)","note.ladybug.title":"Ladybugs","note.ladybug.body":`Ladybugs and their larvae eat aphids, a hundred or more a day each. Ants tending the aphids gang up, biting and shoving until the beetle leaves the plant; the more ants on guard, the slower it eats.
On an untended group, a ladybug only leaves when it is full. Use the Predator tool to put one on an aphid group and see how the ants respond.`,"note.ladybug.hint":"Wait for a ladybug to fly in, or put one on aphids with the Predator tool","note.winged.title":"Winged aphids","note.winged.body":`When an aphid group gets too crowded, it produces winged young that fly off to start new groups on other plants, and the old group shrinks.
Ants don't want their aphids to leave. Experiments found that chemical traces left by black garden ants make aphids grow fewer wings and walk more slowly.`,"note.winged.hint":"Once an aphid group is full (the event log says so)","note.rain.title":"Shutting the door","note.rain.body":`As soon as the sky clouds over, foragers head home and maintenance workers plug the entrances layer by layer with soil pellets. After the rain, once the ground dries, they clear them again.
Rain washes trails off the ground, so the ants have to find their way again afterwards, often with scouts going out first.
Many real ants narrow or close their entrances before rain, at night or in the cold, against both water and enemies.`,"note.rain.hint":"Wait for rain, or pick Call rain in the Water tool","note.flood.title":"Flooding","note.flood.body":`In heavy rain, water pours in through any entrance left open and shallow chambers flood. Nurses hurry the pupae to dry rooms, and the water only goes as it soaks into the soil.
That is why maintenance workers rush to plug the entrances before rain.`,"note.flood.hint":"In heavy rain when an entrance isn't sealed","note.sun.title":"Warming the pupae","note.sun.body":`Pupae develop faster when warm (about 30 °C is best in the game). When the sun has heated the ground and the stones, nurses carry the pupae up to the shallow sun chamber, and back down when it cools in the evening.
Turn over a sun-warmed stone in the wild and you often find a pile of cocoons and workers rushing to carry them away: the underside of a stone is a natural incubator.`,"note.sun.hint":"On a sunny morning, once the shallow soil warms up (the event log says so)","note.cold.title":"Too cold to go out","note.cold.body":`Ants are cold-blooded: their bodies are as warm as their surroundings. When the surface is cool they move slowly and find little food, so they stay in, and few ants are out at dawn or at night.
Real Lasius niger colonies spend the winter deep below the frost, barely moving for months until spring (in the game it's always summer).`,"note.cold.hint":"At night or early morning when the surface is cool","note.water.title":"Pouring water","note.water.body":`A little water or a big cupful washes away the pheromone there and leaves a puddle that slowly dries; the ants walk round it and find their way again. Call rain brings a rain cloud.
Ants need to drink, but standing water is dangerous for them: they are so small that a drop wrapped round them is hard to escape.`,"note.water.hint":"Pick the Water tool","note.spider.title":"Wolf spiders","note.spider.body":`Wolf spiders don't build webs. They roam the ground and pounce on prey, and a lone forager makes a good snack.
Ants that sense a spider nearby hurry away; while one is near the nest, foragers stay in and maintenance workers come out to guard.
Use the Predator tool to put a spider in, or to chase one off.`,"note.spider.hint":"Wait for a spider to wander in, or put one in with the Predator tool","note.mob.title":"Mobbing the spider","note.mob.body":`An ant under attack releases alarm pheromone. Nestmates that smell it rush in, grab the spider's legs and spray formic acid from the tip of the abdomen.
Black garden ants have no sting; numbers and formic acid are their weapons. One ant is no match for a wolf spider, but with dozens on it the spider can only flee. The Pheromones view shows alarm pheromone as red rings.`,"note.mob.hint":"When workers swarm a spider","note.antlion.title":"Antlions","note.antlion.body":`An antlion is the larva of a lacewing-like insect. It circles backwards in dry sand to dig a funnel-shaped pit, then buries itself at the bottom with only its big jaws showing.
An ant that steps over the edge slips as the sand gives way, and struggling only takes it deeper; the antlion flicks sand up to knock it down, then grabs it and sucks it dry.
Antlions only dig in dry ground. The adult looks like a long-winged damselfly.`,"note.antlion.hint":"Put an antlion in with the Predator tool","note.corpse.title":"Carrying out the dead","note.corpse.body":`A while after an ant dies it starts to smell of oleic acid and other fatty acids, and nestmates that smell it carry it to the midden.
In a famous experiment, the biologist E. O. Wilson dabbed oleic acid on living harvester ants. Their nestmates carried them to the midden all the same; when they walked back, they were carried out again, until the smell wore off.`,"note.corpse.hint":"Watch a maintenance worker carry a dead nestmate out","note.founding.title":"How a colony begins","note.founding.body":`On a hot, muggy summer evening (often after rain), mature colonies release thousands of winged young queens and males, and nests all around take off at about the same time. This is the nuptial flight.
The males die soon after mating. Each queen lands, bites off her own wings, squeezes into a crack in the soil and seals herself in. Living on stored fat and the flight muscles she no longer needs, she raises her first workers without eating for months.
The first workers are especially small. Once they're out, the queen does nothing but lay eggs. The game has no nuptial flight and no males.`,"note.founding.hint":"After reading about the queen","note.lifespan.title":"How long a queen lives","note.lifespan.body":`Lasius niger queens are remarkably long-lived: one in a laboratory lived almost 29 years, among the longest-lived insects known. A colony lasts as long as its queen.
Workers live far shorter lives; generation after generation of workers comes and goes while the queen stays. In the game workers live only forty or fifty game days, and the queen never grows old.`,"note.lifespan.hint":"Reach day three","note.keeping.title":"Keeping ants for real","note.keeping.body":`Ant keepers usually start with a single queen just after her nuptial flight rather than digging up a wild colony (you never get it all, and the queen usually stays underground). A common setup is a test tube with water at one end behind a cotton plug; the queen lives in the dry end, kept in the dark and left alone.
Once the first workers appear, feed a little sugar water or diluted honey and some small insects for protein, such as mealworms or pieces of cricket. Leftovers go mouldy, so remove them promptly.
Room temperature of 20–28 °C is fine. When the colony grows, move it to a formicarium with a foraging area attached.`,"note.keeping.hint":"After using the Food tool","note.simplified.title":"What the game simplifies","note.simplified.body":`Time runs much faster: at 1× a day lasts 10 minutes, an egg becomes an adult in about 8 days, and a worker's life is much shorter.
There are no males or nuptial flights, no seasons or winter rest (it's always summer), and no rival colonies fighting over ground; real black garden ants often fight neighbouring colonies over territory and aphids.
Jobs are tidier than in reality: the game works out how many ants each job needs from the colony's stores, while real colonies have no one planning. And 1,000 ants is smaller than a wild colony.`,"note.simplified.hint":"Reach day two"},w0={zh:{"toast.loadFailed":"存档无法读取，已开始新的蚁群","toast.problem":"{problem}，已开始新的蚁群","toast.selectFollowable":"先选中一只蚂蚁","toast.confirmNew":"重新开始会删除当前存档，用一个新的蚁群从头开始。确定吗？","toast.bgOn":"后台运行已开启：离开页面后蚁群继续生活","toast.bgResumed":"你不在的时候，蚁群从 {from} 生活到了 {to}","toast.bgLimited":"手机和平板的浏览器切到后台会冻结页面，离开时蚁群会暂停，回来后接着生活；想让它一直过日子，就让页面停在前台","toast.bgFrozen":"页面在后台被浏览器冻结了约 {n} 分钟，这段时间蚁群暂停了","ui.backgroundTitle":"开启时，最小化浏览器或切到其他标签页后蚁群继续生活；关闭时离开页面就暂停","ui.backgroundLimitedTitle":"手机和平板的浏览器切到后台会冻结页面，离开时蚁群会暂停"},en:{"toast.loadFailed":"Couldn't read the save; started a new colony","toast.problem":"{problem}; started a new colony","toast.selectFollowable":"Select an ant first","toast.confirmNew":"Starting over deletes the current save and begins a new colony from scratch. Continue?","toast.bgOn":"Background running on: the colony keeps living when you leave the page","toast.bgResumed":"While you were away the colony lived on from {from} to {to}","toast.bgLimited":"Phone and tablet browsers freeze pages in the background, so the colony pauses while you are away and carries on when you return. Keep the page open to let it live","toast.bgFrozen":"The browser froze the page for about {n} min; the colony was paused meanwhile","ui.backgroundTitle":"When on, the colony keeps living while the browser is minimized or another tab is open; when off, the game pauses as you leave the page","ui.backgroundLimitedTitle":"Phone and tablet browsers freeze pages in the background, so the colony pauses while you are away"}},S0={"app.title":"赛博养蚂蚁","app.subtitle":"黑毛蚁 Lasius niger","app.loading":"正在生成蚁穴与觅食环境…","role.queen":"蚁后","role.nurse":"保育蚁","role.maintenance":"内务蚁","role.forager":"觅食蚁","role.scout":"侦察蚁","role.worker":"工蚁","roleDesc.queen":"蚁群唯一的繁殖者。婚飞交配后脱落翅膀、独自建巢，此后终生产卵；交配时储存的精子可使用十余年。","roleDesc.nurse":"多为羽化不久的年轻工蚁，留在巢内照料卵、幼虫和蛹，喂养幼虫与蚁后，帮助新蚁破茧。随年龄增长会逐渐转向巢外工作。","roleDesc.maintenance":"中年工蚁，负责挖掘扩建隧道、把垃圾和同伴尸体运出巢外、在巢口警戒巡逻。","roleDesc.forager":"年长工蚁，承担风险最高的巢外工作：搜索并搬运食物、放牧蚜虫，返巢时沿途释放路径信息素招募同伴。侦察蚁更倾向于探索未知区域。","chamber.queen":"蚁后室","chamber.egg":"卵室","chamber.larva":"幼虫室","chamber.pupa":"蛹室","chamber.solar":"向阳育幼室","chamber.food":"储食室","chamber.waste":"垃圾室","chamber.rest":"工蚁休息室","chamber.winter":"越冬室","chamber.numbered":"{name} {n}","chamberDesc.queen":"蚁群唯一的繁殖个体居住于此。黑毛蚁蚁后寿命可达 20 年以上，由保育蚁喂食、清洁，持续产卵。","chamberDesc.egg":"保育蚁把蚁后产下的卵聚成卵团，不断舔舐以保持湿润、抑制霉菌。","chamberDesc.larva":"幼虫无足，完全依赖保育蚁喂食猎物碎块与反刍液。幼虫期获得的营养决定其成年后的体型。","chamberDesc.pupa":"黑毛蚁老熟幼虫吐丝结茧化蛹。蛹偏好较温暖干燥的环境，白天常被搬到靠近地表的房间。","chamberDesc.solar":"紧贴在石块下方的浅层房间。石块白天吸收阳光、升温很快，保育蚁会在午后把蛹搬到这里“晒暖”加速发育，夜间降温后再搬回深处。","chamberDesc.food":"暂存觅食蚁带回的猎物碎块与种子。蜜露等液体食物主要储存在工蚁的嗉囊（“社会胃”）中。","chamberDesc.waste":"食物残渣、茧壳与排泄物先在此堆放，再由内务蚁搬到巢外垃圾堆，以降低病原体在巢内传播的风险。","chamberDesc.rest":"暂时没有任务的工蚁在此聚集休息。这些“后备劳动力”会在蚁群需要时被动员。","chamberDesc.winter":"位于蚁穴最深处，温度全年稳定。秋冬季整个蚁群会迁入这里进入滞育状态。","entrance.main":"主入口","entrance.side":"侧入口","entrance.third":"第三入口","loc.surface":"地表","loc.shaft":"主竖井","loc.tunnel":"隧道","loc.entrance":"入口","place.nearEntrance":"蚁穴入口旁","place.dir":"蚁穴{dir} {d} cm 处","dir.0":"东","dir.1":"东南","dir.2":"南","dir.3":"西南","dir.4":"西","dir.5":"西北","dir.6":"北","dir.7":"东北","item.egg":"卵","item.larva":"幼虫","item.pupa":"蛹","item.food":"食物","item.waste":"垃圾","item.soil":"土粒","item.corpse":"同伴尸体","foodKind.prey":"猎物碎块","foodKind.seed":"种子","foodKind.sugar":"甜液","food.beetle":"甲虫尸体","food.caterpillar":"毛虫尸体","food.seeds":"带油质体的种子","food.fruit":"落果甜汁","food.syrup":"糖水","foodDesc.beetle":"富含蛋白质的猎物。觅食蚁把它肢解成小块搬回巢，主要用于喂养幼虫。","foodDesc.caterpillar":"较大的软体猎物，往往需要很多觅食蚁轮流切割搬运，会形成明显的信息素路径。","foodDesc.seeds":"堇菜等植物的种子附有富含脂肪的油质体，专门“雇佣”蚂蚁传播种子。蚂蚁吃掉油质体后会把种子丢弃到巢外。","foodDesc.fruit":"富含糖分的液体食物。觅食蚁把甜汁吸入嗉囊带回巢，再通过交哺分给同伴。","foodDesc.syrup":"玩家滴下的一滴糖水。和蜜露、花蜜一样被吸进嗉囊带回巢，是饲养蚂蚁最常用的“零食”。","predator.spider":"狼蛛","predator.antlion":"蚁狮","ladybug.name":"瓢虫 gress":"挖掘进度","info.enlargeProgress":"扩大进度","info.building":"扩建中","info.enlarging":"扩大中","info.underStone":" 这间房间正位于大石块下方。","info.depthLabel":"深度","info.size":"尺寸","info.enlargedTimes":"（扩大过 {n} 次）","info.temp":"温度","info.stoneBonus":"（石块 +{t}°C）","info.humidity":"相对湿度","info.wet":"积水","info.floodedNote":"（进水，蛹会被搬走、储食加快变质）","info.antsInRoom":"房间内的蚂蚁","info.flyRoom":"飞到房间","info.plant":"草本植物","info.plantDesc":"蚂蚁会攀爬植物茎叶寻找小型猎物和花外蜜腺。黑毛蚁尤其喜欢照料聚集在嫩茎上的蚜虫，以获取它们分泌的蜜露。","info.aphids":"蚜虫群","info.hostPlant":"寄主植物","info.aphidDesc":"蚜虫吸食植物汁液，把多余的糖分以蜜露排出。黑毛蚁用触角拍打蚜虫“挤奶”，并驱赶瓢虫、草蛉等天敌作为回报——被照料的蚜虫群繁殖更快。蜜露是黑毛蚁最主要的糖类来源。","info.aphidCount":"蚜虫数量","info.aboutN":"约 {n} 只","info.honeydew":"积存蜜露","info.undiscovered":"尚未被蚂蚁发现","info.tended":"正在被照料","info.untended":"暂时无人照料","info.onPlant":"茎上的蚂蚁","info.herders":"固定照料者","info.collected":"累计被采集","info.aphidsDispersing":"太挤了，有翅蚜正在飞走","info.ladybug":"瓢虫","info.ladybugArriving":"正在飞来","info.ladybugEating":"正在吃蚜虫（已吃 {n} 只）","info.ladybugChased":"被 {n} 只工蚁驱赶","info.ladybugLeaving":"吃饱了，正在飞走","info.ladybugDriven":"被蚂蚁赶走，正在飞走","info.eatenByLadybugs":"被瓢虫吃掉","info.foodSource":"食物源","info.foodGone":"这个食物源已经被搬空了。","info.droppedTag":"你投放的","info.foodType":"食物类型","info.left":"剩余","info.leftVal":"{a} / {b} 份","info.discovered":"已被发现","info.notDiscovered":"尚未被发现","info.nearAnts":"周围的蚂蚁","info.taken":"已搬走","info.entranceTitle":"{ent}与蚁丘","info.entranceDesc":"黑毛蚁把挖掘出的土粒堆在巢口周围，形成火山口状的小土丘。土丘能挡雨、吸收阳光为浅层育幼室加温。蚁穴通常有多个入口，便于通风和疏散。下雨前内务蚁会从里面用土粒把入口堵上，防止雨水灌进浅层房间，雨后地面晾干再清开。","info.sealed":"已用土粒封住","info.sealing":"封堵中 {n}%","info.open":"敞开","info.nearEntrance":"入口附近的蚂蚁","info.moundSoil":"土丘上的土粒","info.soilTotal":"累计挖出土粒","info.flyEntrance":"飞到入口","info.midden":"巢外垃圾堆","info.middenDesc":"工蚁把食物残渣、茧壳和同伴尸体集中堆放在巢外固定地点，远离育幼区，以降低病原体传播风险。负责搬运垃圾的工蚁通常不再回到育幼室工作。","info.removedTotal":"累计运出","notes.title":"蚂蚁笔记","notes.group.nest":"蚁穴","notes.group.workers":"工蚁的分工","notes.group.forage":"觅食和分享","notes.group.aphids":"蚜虫和瓢虫","notes.group.weather":"天气和冷热","notes.group.threats":"天敌","notes.group.real":"现实里的蚂蚁","note.nest.title":"这是一窝黑毛蚁","note.nest.body":`黑毛蚁（Lasius niger）是欧洲最常见的蚂蚁之一，草地、路边、花园的石头底下都有；东亚常见的是和它很像的近亲。工蚁只有 3～5 mm，一窝只有一只蚁后，没有兵蚁，守家也是工蚁的事。
地上那两圈小土堆是它们挖出来的土粒，下面是隧道和一间间房间。点一只蚂蚁、一个房间或一处食物，就能看到它是什么、在做什么；打开“地下透视”能看到地下。
野外成熟的黑毛蚁巢常有几千到上万只工蚁，这里约 1000 只。`,"note.nest.hint":"开局就能看到","note.xray.title":"地下的蚁穴","note.xray.body":`透视下能看到整个巢：竖井连着一层层房间。蚁后住在蚁后室；卵、幼虫、蛹按发育分开放；储食室放搬回来的猎物和种子，垃圾室堆着残渣；还有工蚁休息室和越冬室。
蚂蚁会按温度和湿度挪动幼体：蛹要暖一点，晴天就搬到浅处的向阳育幼室。
现实里的蚁穴没有这么规整，房间大小和深浅跟着土质、季节和蚁群大小变，冬天蚂蚁退到深处不结冰的地方。`,"note.xray.hint":"打开“地下透视”，或把镜头开到地面以下","note.queen.title":"蚁后","note.queen.body":`一窝里只有蚁后产卵。工蚁都是她的女儿，是不交配的雌蚁；巢里上千只蚂蚁，其实是一个大家庭。
蚁后几乎不离开蚁后室，保育蚁给她喂食、梳理身体，把她产的卵搬到卵室。蚁后吃不饱，产卵就少。
现实里黑毛蚁的工蚁在没有蚁后时也会产下不受精的卵，孵出来的是雄蚁（游戏里没有雄蚁）。`,"note.queen.hint":"点蚁后，或点蚁后室","note.brood.title":"卵、幼虫和蛹","note.brood.body":`蚂蚁和蝴蝶一样是完全变态：卵孵出没有腿的白色幼虫，幼虫吃够了吐丝结茧化蛹，在茧里长成成虫。黑毛蚁的茧是浅褐色的，常被误叫成“蚂蚁蛋”。
幼虫自己找不到吃的：保育蚁口对口喂它甜液，再把猎物碎块喂给它；新蚁破茧时也要工蚁帮着撕开茧壳。
现实里从卵到工蚁要一两个月，越暖越快；游戏里压缩到约 8 个游戏日。`,"note.brood.hint":"点卵室、幼虫室或蛹室","note.expand.title":"扩建蚁穴","note.expand.body":`蚂蚁多了、房间挤了，内务蚁就开工：先挖一条新隧道，挖通后再往外啃出一间房；挖下的土粒一颗颗叼出巢，堆在入口的土丘上。
研究发现，黑毛蚁的巢挖多大，大致跟着工蚁的数量走：挤了就挖，够住了就停，并没有谁在指挥。
蚁群面板的“蚁穴”一栏能看到挤不挤、正在挖什么。`,"note.expand.hint":"蚁穴挤到一定程度时（看蚁群面板里的拥挤程度）","note.midden.title":"垃圾堆","note.midden.body":`吃剩的猎物、空茧和死去的同伴，内务蚁都会清走：先放进巢里的垃圾室，再运到巢外的垃圾堆。
垃圾留在巢里会发霉、滋生病菌，所以蚂蚁把它们放得离育幼的房间远远的。切叶蚁甚至有专门管垃圾的工蚁，它们不再进育幼的地方，免得把病菌带进去。`,"note.midden.hint":"点巢外的垃圾堆，或巢里的垃圾室","note.roles.title":"按年龄分工","note.roles.body":`工蚁一生会换几种活：刚羽化时留在巢里照顾卵和幼虫（保育蚁），过一阵做内务，清扫、挖掘、搬垃圾、守门（内务蚁），最后才出巢觅食（觅食蚁）。
外面有天敌、会迷路，把最危险的活留给快到寿命尽头的老蚂蚁，对蚁群最划算。
这不是死规定：觅食蚁不够时，年轻的工蚁会提前出门。打开“分工着色”，蚂蚁按分工上色：粉色保育蚁，蓝色内务蚁，绿色觅食蚁，橙色蚁后。`,"note.roles.hint":"打开“分工着色”，或分别点过保育蚁和觅食蚁","note.nurse.title":"保育蚁","note.nurse.body":`最年轻的工蚁，几乎不出巢。它们喂幼虫和蚁后，把卵、幼虫和蛹舔干净（唾液能抑制霉菌），按温度把蛹搬来搬去，还帮新蚁撕开茧壳。
蚁群面板里写着现在有多少只保育蚁、该有多少只。`,"note.nurse.hint":"点一只保育蚁（分工着色里粉色的）","note.maintenance.title":"内务蚁","note.maintenance.body":"中年的工蚁：清扫房间，把垃圾和尸体搬出去，挖隧道、扩房间；下雨前用土粒堵住入口，雨停了再清开；狼蛛靠近时出巢在入口警戒。","note.maintenance.hint":"点一只内务蚁（分工着色里蓝色的）","note.forager.title":"觅食蚁","note.forager.body":`年纪最大的工蚁，大部分时间在外面：找食物、切猎物、吸甜汁、照料蚜虫。带着食物回来时一路留下信息素，嗉囊装满了就把甜液分给巢里的同伴。
点它能看到这一趟的经过，选“跟随观察”就能跟着它走。`,"note.forager.hint":"点一只觅食蚁（分工着色里绿色的）","note.scout.title":"侦察蚁","note.scout.body":`觅食蚁里有少数不跟着路线走，四处转着找新的食物，叫侦察蚁。找到了就一路留下信息素回巢，招呼同伴出来。
雨后地面还潮时，也是侦察蚁先出去看看，其余的在巢里等着。`,"note.scout.hint":"点一只侦察蚁（蚁群面板里有数量）","note.shift.title":"提前转岗","note.shift.body":`觅食蚁少了（被狼蛛吃掉、掉进蚁狮的坑），出门找吃的人手不够，一些年纪还轻的工蚁就提前转成觅食蚁。
现实里没有谁下命令，每只蚂蚁按自己碰到的情况换活，比如多久没碰到带食物回来的同伴。游戏里简化成按蚁群的储备算出各分工该有多少只。`,"note.shift.hint":"觅食蚁不够的时候（事件里会写）","note.trail.title":"信息素路线","note.trail.body":`觅食蚁找到食物往回走，一路用腹部末端在地上点出路径信息素。同伴闻着走，找到食物的回来时再加一笔，走的越多路线越浓；没有蚂蚁走了，一两分钟就淡一半。
近处、好走的路来回快，加得勤，越来越浓；远路慢慢淡掉。所以没有谁指挥，蚁群也能走出一条近路。
打开“信息素”视图：黄橙色是觅食路线，蓝色是领地足迹，红圈是警报。`,"note.trail.hint":"打开“信息素”视图，或等觅食蚁发现一处食物","note.memory.title":"记住路","note.memory.body":`黑毛蚁的觅食蚁记性不错：去过一两趟的食物，下次不闻信息素也能直接走过去。实验里把信息素路线引向另一边，有经验的觅食蚁多半还是按自己记的路走。
信息素主要帮没去过的同伴找到地方，记忆让老手走得更快。`,"note.memory.hint":"看一只觅食蚁前往记忆中的觅食地点","note.share.title":"社会胃","note.share.body":`蚂蚁的嗉囊像一个公用的胃：觅食蚁把甜汁、蜜露装在里面带回来，吐出一滴口对口喂给同伴，同伴再传给别的同伴，这叫交哺。
食物就这样一传十、十传百地分到全巢，同时传开的还有气味和别的化学信号。蚁群面板里的“社会胃”就是所有蚂蚁嗉囊里的甜液加起来。`,"note.share.hint":"看两只蚂蚁交哺（巢里的储食室附近最常见）","note.prey.title":"切开猎物","note.prey.body":`甲虫、毛虫的尸体太大，一只蚂蚁搬不动，就地用上颚切成小块，一块块搬回储食室。
猎物是蛋白质，主要给正在长身体的幼虫和产卵的蚁后吃；成年工蚁自己主要靠糖。`,"note.prey.hint":"点一具甲虫或毛虫尸体，或看蚂蚁在那里切割","note.seeds.title":"种子的油质体","note.seeds.body":`不少植物的种子上长着一小块油亮的附属物，叫油质体，富含脂肪。蚂蚁把整粒种子搬回巢，吃掉油质体，把种子扔到垃圾堆。
种子就这样被带到离母株远、又有养分的地方发芽，堇菜、白屈菜都靠蚂蚁播种。植物给饭，蚂蚁帮忙，两边都得益。`,"note.seeds.hint":"点一处带油质体的种子","note.feed.title":"投食","note.feed.body":`点地面就能放下食物。糖水和落果的甜汁会被吸进嗉囊带回去，甲虫、毛虫尸体会被切开搬走，种子的油质体也能吃。
食物要先被侦察蚁或觅食蚁碰到，才会有信息素路线把大家引过去，放得远可能要等一阵。`,"note.feed.hint":"选“投食”工具","note.obstacle.title":"挡住路线","note.obstacle.body":`在信息素路线上放一根树枝，蚂蚁先乱一阵，四处绕；绕过去的那几只把新路标出来，过一会儿大家都走绕过去最近的那条。
这和一个有名的实验很像：在蚁巢和食物之间搭一长一短两座桥，蚂蚁很快集中走短的那座，因为走短桥来回快，信息素积得更浓。`,"note.obstacle.hint":"选“障碍”工具","note.aphids.title":"放牧蚜虫","note.aphids.body":`蚜虫吸植物的汁，排出带糖的蜜露。黑毛蚁是有名的“牧蚜人”：爬上植物用触角拍打蚜虫，接住它排出的蜜露，带回去分给同伴。
作为回报，蚂蚁替蚜虫赶走瓢虫、草蛉幼虫这些天敌，被照料的蚜虫群长得更快。有的蚂蚁冬天还把蚜虫卵搬进巢里过冬。
蚁群面板里能看到已经发现了几群蚜虫。`,"note.aphids.hint":"等觅食蚁发现一群蚜虫（在草本植物上）","note.ladybug.title":"瓢虫","note.ladybug.body":`瓢虫和它的幼虫都吃蚜虫，一只一天能吃上百只。照料蚜虫的工蚁会围上去咬、推，把它赶下植物；守着的蚂蚁越多，瓢虫吃得越慢。
没人照料的蚜虫群，瓢虫吃饱了才飞走。可以用“天敌”工具把瓢虫放到蚜虫群上，看蚂蚁怎么应对。`,"note.ladybug.hint":"等瓢虫飞来，或用“天敌”工具放一只在蚜虫群上","note.winged.title":"有翅蚜","note.winged.body":`一群蚜虫太挤，就会生出长翅膀的后代，飞去别的植物另起一群，原来那群慢慢变小。
蚂蚁不愿意自己的蚜虫飞走。实验发现，黑毛蚁留下的化学信号能让蚜虫少长翅膀、走得慢一些。`,"note.winged.hint":"蚜虫群挤满以后（事件里会写）","note.rain.title":"封门躲雨","note.rain.body":`天一转阴，觅食蚁陆续回巢，内务蚁衔着土粒把入口一层层堵上；雨停后等地面晾干，再把土粒清开。
雨水会冲掉地上的信息素，所以雨后要重新找路，常常是侦察蚁先出去。
现实里不少蚂蚁会在雨前、夜里或冷天把入口封小或封上，挡雨水，也挡天敌。`,"note.rain.hint":"等一场雨，或用“浇水”工具选“下一场雨”","note.flood.title":"进水了","note.flood.body":`雨下大了，水从没封好的入口灌进去，浅处的房间会积水。保育蚁赶紧把蛹搬到干的房间，水要慢慢渗进土里才退。
所以内务蚁在雨前抢着封门。`,"note.flood.hint":"雨下大、入口没封住时","note.sun.title":"晒蛹","note.sun.body":`蛹在暖一点的地方长得快（游戏里约 30 °C 最好）。白天太阳把地面和石块晒热了，保育蚁就把蛹搬到浅处的向阳育幼室；傍晚凉了再搬回深处。
野外翻开一块晒热的石头，常能看到下面一堆茧和慌着搬茧的工蚁：石头底下是天然的孵化器。`,"note.sun.hint":"晴天上午，浅层升温以后（事件里会写）","note.cold.title":"冷了就不出门","note.cold.body":`蚂蚁是变温动物，体温跟着周围走。地表凉了，它们走得慢，出去也找不到多少吃的，就留在巢里；清晨和夜里外面的蚂蚁也少。
现实里黑毛蚁冬天整窝退到深处不结冰的地方，几个月几乎不动，开春才出来（游戏里一直是夏天）。`,"note.cold.hint":"夜里或清晨地表凉的时候","note.water.title":"浇水","note.water.body":`一点水或一大杯水会冲掉那里的信息素，留下慢慢蒸发的水洼，蚂蚁要绕着走、重新找路。选“下一场雨”能招来一片雨云。
蚂蚁也要喝水，但积水对它们很危险：身体太小，被水滴裹住很难脱身。`,"note.water.hint":"选“浇水”工具","note.spider.title":"狼蛛","note.spider.body":`狼蛛不织网，在地面游荡，看到猎物就扑上去，落单的觅食蚁是它的点心。
蚂蚁发觉狼蛛靠近会赶紧躲开；巢口附近有狼蛛时，觅食蚁暂时不出门，内务蚁出巢警戒。
可以用“天敌”工具放一只狼蛛进来，也可以把它赶走。`,"note.spider.hint":"等狼蛛游荡进来，或用“天敌”工具放一只","note.mob.title":"群起围攻","note.mob.body":`被攻击的蚂蚁会放出警报信息素，附近的同伴闻到就冲过来，咬住狼蛛的腿，从腹部末端喷蚁酸。
黑毛蚁没有螫针，靠的是人多和蚁酸：一只蚂蚁打不过狼蛛，几十只一起上，狼蛛只能逃走。打开“信息素”视图能看到警报信息素的红圈。`,"note.mob.hint":"狼蛛被工蚁围住的时候","note.antlion.title":"蚁狮","note.antlion.body":`蚁狮是蚁蛉的幼虫。它在干燥的沙土里倒退着转圈，挖出一个漏斗形的坑，自己埋在坑底，只露出一对大颚。
蚂蚁走到坑边一滑，沙子往下溜，越挣扎掉得越深；蚁狮还会往上弹沙子把它打下来，再抓住吸干。
蚁狮只在干的地面挖坑。蚁蛉成虫像一只翅膀很长的豆娘。`,"note.antlion.hint":"用“天敌”工具放一只蚁狮","note.corpse.title":"搬走死去的同伴","note.corpse.body":`蚂蚁死后过一阵，身上会散发油酸等脂肪酸的气味，同伴闻到就把它搬去垃圾堆。
生物学家 E. O. Wilson 做过一个有名的实验：把油酸抹在活的收获蚁身上，同伴照样把它抬去垃圾堆；它爬回来，又被抬出去，直到气味散掉。`,"note.corpse.hint":"看内务蚁把同伴的尸体搬出巢","note.founding.title":"一窝蚂蚁是怎么开始的","note.founding.body":`夏天闷热的傍晚（常在雨后），成熟的蚁群放出成千上万长着翅膀的新蚁后和雄蚁，附近的蚁巢差不多同时起飞，这就是婚飞。
交配后雄蚁很快死去。蚁后落地，咬掉自己的翅膀，钻进土缝把自己封起来，靠身体里存的脂肪和不再用的飞行肌养大第一批工蚁，几个月不吃东西。
第一批工蚁个子特别小。它们出来以后，蚁后就只管产卵了。游戏里没有婚飞和雄蚁。`,"note.founding.hint":"读到“蚁后”以后","note.lifespan.title":"蚁后能活多久","note.lifespan.body":`黑毛蚁的蚁后非常长寿：实验室里有一只活了将近 29 年，是已知寿命最长的昆虫之一。一窝蚂蚁能延续的年头，就是蚁后的寿命。
工蚁就短得多，一窝里的工蚁一代代换，蚁后一直在。游戏里的工蚁只活四五十个游戏日，蚁后不会老。`,"note.lifespan.hint":"玩到第三天","note.keeping.title":"现实里怎么养蚂蚁","note.keeping.body":`养蚂蚁一般从一只刚婚飞完的蚁后开始，不去挖野外的整窝（挖不全，蚁后多半留在地下）。常用一根试管：一头装水、用棉花塞住，蚁后住在干的那头，放在暗处别去打扰。
第一批工蚁出来以后再喂：一点糖水或蜂蜜水，加一些小虫当蛋白质，比如面包虫、切块的蟋蟀。喂多了吃不完会发霉，要及时清掉。
室温 20～28 °C 就行。蚁群大了再搬进人工巢，外接一个觅食区。`,"note.keeping.hint":"用过“投食”工具以后","note.simplified.title":"游戏里简化了什么","note.simplified.body":`时间快得多：1 倍速下一天只有 10 分钟，卵到成蚁约 8 天，工蚁的一生也短得多。
没有雄蚁和婚飞，没有季节和冬眠（一直是夏天），也没有别的蚁群来抢地盘；现实里黑毛蚁常和邻居的蚁群为地盘和蚜虫打架。
分工比真实的整齐：游戏按蚁群的储备算出各分工该有多少只，现实里没有谁统一安排。蚁群约 1000 只，也比野外的小。`,"note.simplified.hint":"玩到第二天"};$g({zh:S0,en:M0},w0);const F={seed:20261021,world:{size:240,forageRadius:112,terrainSegments:220,stoneHeat:6,stoneHeatDepth:26,cameraRange:300,cameraMinY:-140,cameraMaxY:320},time:{dayLength:600,startHour:7.5},light:{sun:3.2,hemiDay:1.15,hemiNight:.95,moon:2.4,surfaceLamp:5,xrayLamp:12},colony:{initialWorkers:1e3,maxPopulation:3e3,roleRatio:{nurse:.26,maintenance:.24},scoutRatio:.12,initialFood:120,initialBrood:{egg:50,larva:70,pupa:45},eggsPerDay:36,workerLifespanDays:[45,90],initialCropShare:.4},polyethism:{reviewDays:.02,maxShift:.02,ageJitterDays:4,nurseBase:50,nursePerBrood:1.1},social:{shareAmount:.3,contactRadius:.9,contactCooldown:[6,16]},loiter:{chance:.45,minTemp:14,offset:[2,7],radius:[3,5],time:[30,80]},crowd:{restDensity:2.2,restPerPick:4,patrolPerPick:6,moundRef:120},aphid:{colonies:6,initialCount:[16,36],maxCount:80,honeydewPerAphidDay:.2,maxHoneydew:6,untendedLoss:.04,crowdAt:.7,disperseTo:.4,dispersePerDay:1.5},ladybug:{perDay:2.5,max:3,minTemp:12,eatPerDay:150,chasedSlow:.5,appetite:[15,30],harassLimit:60,harassRecover:.5,minAphids:8},expansion:{capacityPerArea:1.8,trigger:.88,tunnelSoilPerUnit:4,chamberSoilPerArea:4,maxDiggers:18,maxChambers:22,enlargeChance:.4,enlargeScale:1.2,maxRoomRadius:12},brood:{eggDays:2,larvaDays:3.2,pupaDays:2.4,larvaFeedsNeeded:3},ant:{workerLength:1,queenScale:2.1,lodDistance:35,personalSpace:.32,tunnelGap:.9,speedSurface:3.2,hugRate:2.5,hugProbe:2.5,hugMax:25,speedNest:2.4,hungerPerDay:.4,eatAmount:.25,senseFoodRadius:7},pheromone:{cellSize:1,trailHalfLife:90,depositFood:1,homeHalfLife:900,depositHome:.03},food:{initialSources:12,spawnIntervalSec:35,maxSources:20},intervention:{maxPlacedFood:30,maxPlacedObstacles:40,waterRadius:[4,8],waterDays:.25,washTrail:.05,washHome:.3},predators:{spiderPerDay:1.2,maxNaturalSpiders:2,spiderStayDays:[.4,.8],spiderMeals:3,spiderSense:7,spiderTrailTurn:1.5,spiderWalk:2.2,spiderRush:6,spiderCatc
