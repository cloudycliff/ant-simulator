s, carry waste and dead nestmates out of the nest, and guard and patrol the entrances.","roleDesc.forager":"The oldest workers, doing the riskiest work outside: searching for and carrying food, herding aphids, and laying a trail pheromone on the way home to recruit nestmates. Scouts are more inclined to explore unknown areas.","chamber.queen":"queen chamber","chamber.egg":"egg chamber","chamber.larva":"larva chamber","chamber.pupa":"pupa chamber","chamber.solar":"solar nursery","chamber.food":"food store","chamber.waste":"waste chamber","chamber.rest":"rest chamber","chamber.winter":"wintering chamber","chamber.numbered":"{name} {n}","chamberDesc.queen":"Home of the colony's only reproductive. A black garden ant queen can live for more than 20 years; nurses feed and clean her while she keeps laying eggs.","chamberDesc.egg":"Nurses gather the queen's eggs into clusters and keep licking them to keep them moist and stop mold.","chamberDesc.larva":"Larvae have no legs and depend entirely on nurses feeding them prey fragments and regurgitated liquid. What a larva eats decides how big it will be as an adult.","chamberDesc.pupa":"Fully grown black garden ant larvae spin a silk cocoon and pupate. Pupae prefer warm, dry conditions and are often moved to rooms near the surface during the day.","chamberDesc.solar":'A shallow room pressed right under a stone. The stone soaks up sunlight and heats quickly, so in the afternoon nurses move the pupae here to "sunbathe" and develop faster, then carry them back down when it cools at night.',"chamberDesc.food":`Temporary storage for prey fragments and seeds brought back by foragers. Liquid food such as honeydew is mostly stored in the workers' crops (the "social stomach").`,"chamberDesc.waste":"Food scraps, cocoon shells and droppings are piled here first, then carried by maintenance workers to the midden outside, which limits the spread of pathogens inside the nest.","chamberDesc.rest":'Workers with no current task gather here to rest. This "reserve labor force" is mobilized when the colony needs it.',"chamberDesc.winter":"The deepest part of the nest, with a stable temperature all year round. In autumn and winter the whole colony moves in here and goes dormant.","entrance.main":"main entrance","entrance.side":"side entrance","entrance.third":"third entrance","loc.surface":"surface","loc.shaft":"main shaft","loc.tunnel":"tunnel","loc.entrance":"entrance","place.nearEntrance":"beside the nest entrance","place.dir":"{d} cm {dir} of the nest","dir.0":"east","dir.1":"southeast","dir.2":"south","dir.3":"southwest","dir.4":"west","dir.5":"northwest","dir.6":"north","dir.7":"northeast","item.egg":"egg","item.larva":"larva","item.pupa":"pupa","item.food":"food","item.waste":"waste","item.soil":"soil pellet","item.corpse":"dead nestmate","foodKind.prey":"prey pieces","foodKind.seed":"seeds","foodKind.sugar":"sugary liquid","food.beetle":"beetle carcass","food.caterpillar":"caterpillar carcass","food.seeds":"seeds with elaiosomes","food.fruit":"fallen fruit juice","food.syrup":"sugar water","foodDesc.beetle":"Protein-rich prey. Foragers cut it into small pieces and carry them home, mainly to feed the larvae.","foodDesc.caterpillar":"Large, soft-bodied prey. It usually takes many foragers taking turns to cut it up and carry it away, which builds a clear pheromone trail.","foodDesc.seeds":'Seeds of violets and similar plants carry a fat-rich elaiosome that "hires" ants to disperse them. The ants eat the elaiosome and then discard the seed outside the nest.',"foodDesc.fruit":"A sugar-rich liquid food. Foragers suck the juice into their crops, bring it home, and share it with nestmates through trophallaxis.","foodDesc.syrup":'A drop of sugar water from you. Like honeydew and nectar, it is sucked into the crop and carried home; it is the most common "snack" for pet ants.',"predator.spider":"wolf spider","predator.antlion":"antlion","ladybug.name":"ladybird","predatorDesc.spider":"A hunting spider of the famil s":"Ants nearby","info.taken":"Carried away","info.entranceTitle":i=>`${Zs(i.ent)} and mound`,"info.entranceDesc":"Black garden ants pile excavated soil around the entrance into a small crater-shaped mound. The mound keeps rain out and soaks up sunlight to warm the shallow nurseries. A nest usually has several entrances for ventilation and escape. Before rain, maintenance workers plug the entrances from inside with soil pellets so water can't flood the shallow rooms, and clear them once the ground has dried.","info.sealed":"Sealed with soil","info.sealing":"Sealing {n}%","info.open":"Open","info.nearEntrance":"Ants near the entrance","info.moundSoil":"Soil pellets on the mound","info.soilTotal":"Total soil dug","info.flyEntrance":"Fly to entrance","info.midden":"Midden","info.middenDesc":"Workers pile food scraps, cocoon shells and dead nestmates at a fixed spot outside the nest, away from the brood, to limit the spread of pathogens. Workers that carry waste usually never go back to work in the nurseries.","info.removedTotal":"Total removed"},n0={zh:{"toast.loadFailed":"存档无法读取，已开始新的蚁群","toast.problem":"{problem}，已开始新的蚁群","toast.selectFollowable":"先选中一只蚂蚁","toast.confirmNew":"重新开始会删除当前存档，用一个新的蚁群从头开始。确定吗？","toast.bgOn":"后台运行已开启：离开页面后蚁群继续生活","toast.bgResumed":"你不在的时候，蚁群从 {from} 生活到了 {to}","toast.bgLimited":"手机和平板的浏览器切到后台会冻结页面，离开时蚁群会暂停，回来后接着生活；想让它一直过日子，就让页面停在前台","toast.bgFrozen":"页面在后台被浏览器冻结了约 {n} 分钟，这段时间蚁群暂停了","ui.backgroundTitle":"开启时，最小化浏览器或切到其他标签页后蚁群继续生活；关闭时离开页面就暂停","ui.backgroundLimitedTitle":"手机和平板的浏览器切到后台会冻结页面，离开时蚁群会暂停"},en:{"toast.loadFailed":"Couldn't read the save; started a new colony","toast.problem":"{problem}; started a new colony","toast.selectFollowable":"Select an ant first","toast.confirmNew":"Starting over deletes the current save and begins a new colony from scratch. Continue?","toast.bgOn":"Background running on: the colony keeps living when you leave the page","toast.bgResumed":"While you were away the colony lived on from {from} to {to}","toast.bgLimited":"Phone and tablet browsers freeze pages in the background, so the colony pauses while you are away and carries on when you return. Keep the page open to let it live","toast.bgFrozen":"The browser froze the page for about {n} min; the colony was paused meanwhile","ui.backgroundTitle":"When on, the colony keeps living while the browser is minimized or another tab is open; when off, the game pauses as you leave the page","ui.backgroundLimitedTitle":"Phone and tablet browsers freeze pages in the background, so the colony pauses while you are away"}},i0={"app.title":"赛博养蚂蚁","app.subtitle":"黑毛蚁 Lasius niger","app.loading":"正在生成蚁穴与觅食环境…","role.queen":"蚁后","role.nurse":"保育蚁","role.maintenance":"内务蚁","role.forager":"觅食蚁","role.scout":"侦察蚁","role.worker":"工蚁","roleDesc.queen":"蚁群唯一的繁殖者。婚飞交配后脱落翅膀、独自建巢，此后终生产卵；交配时储存的精子可使用十余年。","roleDesc.nurse":"多为羽化不久的年轻工蚁，留在巢内照料卵、幼虫和蛹，喂养幼虫与蚁后，帮助新蚁破茧。随年龄增长会逐渐转向巢外工作。","roleDesc.maintenance":"中年工蚁，负责挖掘扩建隧道、把垃圾和同伴尸体运出巢外、在巢口警戒巡逻。","roleDesc.forager":"年长工蚁，承担风险最高的巢外工作：搜索并搬运食物、放牧蚜虫，返巢时沿途释放路径信息素招募同伴。侦察蚁更倾向于探索未知区域。","chamber.queen":"蚁后室","chamber.egg":"卵室","chamber.larva":"幼虫室","chamber.pupa":"蛹室","chamber.solar":"向阳育幼室","chamber.food":"储食室","chamber.waste":"垃圾室","chamber.rest":"工蚁休息室","chamber.winter":"越冬室","chamber.numbered":"{name} {n}","chamberDesc.queen":"蚁群唯一的繁殖个体居住于此。黑毛蚁蚁后寿命可达 20 年以上，由保育蚁喂食、清洁，持续产卵。","chamberDesc.egg":"保育蚁把蚁后产下的卵聚成卵团，不断舔舐以保持湿润、抑制霉菌。","chamberDesc.larva":"幼虫无足，完全依赖保育蚁喂食猎物碎块与反刍液。幼虫期获得的营养决定其成年后的体型。","chamberDesc.pupa":"黑毛蚁老熟幼虫吐丝结茧化蛹。蛹偏好较温暖干燥的环境，白天常被搬到靠近地表的房间。","chamberDesc.solar":"紧贴在石块下方的浅层房间。石块白天吸收阳光、升温很快，保育蚁会在午后把蛹搬到这里“晒暖”加速发育，夜间降温后再搬回深处。","chamberDesc.food":"暂存觅食蚁带回的猎物碎块与种子。蜜露等液体食物主要储存在工蚁的嗉囊（“社会胃”）中。","chamberDesc.waste":"食物残渣、茧壳与排泄物先在此堆放，再由内务蚁搬到巢外垃圾堆，以降低病原体在巢内传播的风险。","chamberDesc.rest":"暂时没有任务的工蚁在此聚集休息。这些“后备劳动力”会在蚁群需要时被动员。","chamberDesc.winter":"位于蚁穴最深处，温度全年稳定。秋冬季整个蚁群会迁入这里进入滞育状态。","entrance.main":"主入口","entrance.side":"侧入口","entrance.third":"第三入口","loc.surface":"地表","loc.shaft":"主竖井","loc.tunnel":"隧道","loc.entrance":"入口
