后","role.nurse":"保育蚁","role.maintenance":"内务蚁","role.forager":"觅食蚁","role.scout":"侦察蚁","role.worker":"工蚁","roleDesc.queen":"蚁群唯一的繁殖者。婚飞交配后脱落翅膀、独自建巢，此后终生产卵；交配时储存的精子可使用十余年。","roleDesc.nurse":"多为羽化不久的年轻工蚁，留在巢内照料卵、幼虫和蛹，喂养幼虫与蚁后，帮助新蚁破茧。随年龄增长会逐渐转向巢外工作。","roleDesc.maintenance":"中年工蚁，负责挖掘扩建隧道、把垃圾和同伴尸体运出巢外、在巢口警戒巡逻。","roleDesc.forager":"年长工蚁，承担风险最高的巢外工作：搜索并搬运食物、放牧蚜虫，返巢时沿途释放路径信息素招募同伴。侦察蚁更倾向于探索未知区域。","chamber.queen":"蚁后室","chamber.egg":"卵室","chamber.larva":"幼虫室","chamber.pupa":"蛹室","chamber.solar":"向阳育幼室","chamber.food":"储食室","chamber.waste":"垃圾室","chamber.rest":"工蚁休息室","chamber.winter":"越冬室","chamber.numbered":"{name} {n}","chamberDesc.queen":"蚁群唯一的繁殖个体居住于此。黑毛蚁蚁后寿命可达 20 年以上，由保育蚁喂食、清洁，持续产卵。","chamberDesc.egg":"保育蚁把蚁后产下的卵聚成卵团，不断舔舐以保持湿润、抑制霉菌。","chamberDesc.larva":"幼虫无足，完全依赖保育蚁喂食猎物碎块与反刍液。幼虫期获得的营养决定其成年后的体型。","chamberDesc.pupa":"黑毛蚁老熟幼虫吐丝结茧化蛹。蛹偏好较温暖干燥的环境，白天常被搬到靠近地表的房间。","chamberDesc.solar":"紧贴在石块下方的浅层房间。石块白天吸收阳光、升温很快，保育蚁会在午后把蛹搬到这里“晒暖”加速发育，夜间降温后再搬回深处。","chamberDesc.food":"暂存觅食蚁带回的猎物碎块与种子。蜜露等液体食物主要储存在工蚁的嗉囊（“社会胃”）中。","chamberDesc.waste":"食物残渣、茧壳与排泄物先在此堆放，再由内务蚁搬到巢外垃圾堆，以降低病原体在巢内传播的风险。","chamberDesc.rest":"暂时没有任务的工蚁在此聚集休息。这些“后备劳动力”会在蚁群需要时被动员。","chamberDesc.winter":"位于蚁穴最深处，温度全年稳定。秋冬季整个蚁群会迁入这里进入滞育状态。","entrance.main":"主入口","entrance.side":"侧入口","loc.surface":"地表","loc.shaft":"主竖井","loc.tunnel":"隧道","loc.entrance":"入口","place.nearEntrance":"蚁穴入口旁","place.dir":"蚁穴{dir} {d} cm 处","dir.0":"东","dir.1":"东南","dir.2":"南","dir.3":"西南","dir.4":"西","dir.5":"西北","dir.6":"北","dir.7":"东北","item.egg":"卵","item.larva":"幼虫","item.pupa":"蛹","item.food":"食物","item.waste":"垃圾","item.soil":"土粒","item.corpse":"同伴尸体","foodKind.prey":"猎物碎块","foodKind.seed":"种子","foodKind.sugar":"甜液","food.beetle":"甲虫尸体","food.caterpillar":"毛虫尸体","food.seeds":"带油质体的种子","food.fruit":"落果甜汁","food.syrup":"糖水","foodDesc.beetle":"富含蛋白质的猎物。觅食蚁把它肢解成小块搬回巢，主要用于喂养幼虫。","foodDesc.caterpillar":"较大的软体猎物，往往需要很多觅食蚁轮流切割搬运，会形成明显的信息素路径。","foodDesc.seeds":"堇菜等植物的种子附有富含脂肪的油质体，专门“雇佣”蚂蚁传播种子。蚂蚁吃掉油质体后会把种子丢弃到巢外。","foodDesc.fruit":"富含糖分的液体食物。觅食蚁把甜汁吸入嗉囊带回巢，再通过交哺分给同伴。","foodDesc.syrup":"玩家滴下的一滴糖水。和蜜露、花蜜一样被吸进嗉囊带回巢，是饲养蚂蚁最常用的“零食”。","predator.spider":"狼蛛","predator.antlion":"蚁狮","predatorDesc.spider":"狼蛛科（Lycosidae）的游猎型蜘蛛，不结网，靠视觉和地面振动发现猎物，突然冲刺扑击。地表的觅食蚁是它常见的猎物。抓到后注入毒液、吸食体液，留下空壳。","predatorDesc.antlion":"蚁蛉（Myrmeleontidae）的幼虫。它在干燥松软的地面倒退着挖出漏斗形的坑，自己埋在坑底只露出大颚。蚂蚁踩到坑壁会顺着松沙滑下去，越往下越难爬出来；被抓住后体液被吸干，空壳会被蚁狮甩出坑外。","spiderState.wander":"四处游荡，寻找猎物","spiderState.pause":"伏地不动，感知振动","spiderState.chase":"正在扑向一只蚂蚁","spiderState.feed":"正在进食","spiderState.leave":"吃饱了，正在离开","obstacle.pebble":"小石子","obstacle.rock":"大石块","obstacle.twig":"树枝路障","weather.heavyRain":"大雨","weather.lightRain":"小雨","weather.overcast":"转阴","weather.afterRain":"雨后","weather.clear":"晴","cause.age":"衰老","cause.starve":"饥饿","cause.spider":"被狼蛛捕食","cause.mobbed":"围攻狼蛛时被咬死","cause.antlion":"落入蚁狮陷阱","act.idle":"待命","act.dead":"已死亡（{cause}）","act.solicit":"{reason}，向 #{id} 乞食","act.receiveShare":"与 #{id} 交哺：接受反刍的甜液","act.seekPartner":"在房间里寻找需要食物的同伴","act.approachShare":"走向 #{id}，准备交哺","act.giveShare":"与 #{id} 交哺：反刍嗉囊中的甜液","act.unloadStore":"进入储食室，把甜液分给巢内同伴","act.shareIn":"前往{room}分享甜液","act.bringCrop":"把嗉囊中的甜液带到{room}","act.eatCrop":"从自己的嗉囊中取食","act.goEat":"饥饿，前往储食室进食","act.rest":"在休息室休息","act.goTo":"前往{room}","act.shelterRain":"下雨了，赶回巢内躲雨","act.shelterCloud":"天色转阴，提前返巢","act.shelterWet":"地面还湿，返回巢内","act.restRain":"在巢内躲雨","act.restWet":"等地面晾干","act.queenIdle":"在蚁后室中缓慢移动，接受工蚁照料","act.lay":"产卵","act.queenHungry":"饥饿，等待保育蚁喂食","act.carryEgg":"把卵从蚁后室搬到卵室","act.carryBrood":"把{item}搬到{room}","act.fetchBrood":"前往{room}取{item}","act.tidyBrood":"整理幼体堆","act.goEclose":"前往{room}，帮助新蚁破茧","act.eclose":"用上颚撕开茧壳，帮助新工蚁羽化","act.feedLarvaCrop":"带着嗉囊里的甜液去喂幼虫","act.feedLarvaFetch":"前往储食室，为幼虫取食","act.noFood":"没有取到食物","act.regurgitate":"口对口把甜液反哺给幼虫","act.feedSolid":"把食物碎块喂给幼虫","act.tendLarvae":"在幼虫室照料幼虫","act.fetchQueen":"为蚁后取食","act.feedQueen":"喂食蚁后","act.groomQueen":"为蚁后梳理清洁","act.goQueen":"前往蚁后室","act.attendQueen":"侍奉蚁后：梳理、舔舐蚁后体表","act.cleanEggs":"舔舐清洁卵团，防止霉菌滋生","act.cleanLarvae":"舔舐清洁幼虫，防止霉菌滋生","act flyRoom":"飞到房间","info.plant":"草本植物","info.plantDesc":"蚂蚁会攀爬植物茎叶寻找小型猎物和花外蜜腺。黑毛蚁尤其喜欢照料聚集在嫩茎上的蚜虫，以获取它们分泌的蜜露。","info.aphids":"蚜虫群","info.hostPlant":"寄主植物","info.aphidDesc":"蚜虫吸食植物汁液，把多余的糖分以蜜露排出。黑毛蚁用触角拍打蚜虫“挤奶”，并驱赶瓢虫、草蛉等天敌作为回报——被照料的蚜虫群繁殖更快。蜜露是黑毛蚁最主要的糖类来源。","info.aphidCount":"蚜虫数量","info.aboutN":"约 {n} 只","info.honeydew":"积存蜜露","info.undiscovered":"尚未被蚂蚁发现","info.tended":"正在被照料","info.untended":"暂时无人照料","info.onPlant":"茎上的蚂蚁","info.herders":"固定照料者","info.collected":"累计被采集","info.foodSource":"食物源","info.foodGone":"这个食物源已经被搬空了。","info.droppedTag":"你投放的","info.foodType":"食物类型","info.left":"剩余","info.leftVal":"{a} / {b} 份","info.discovered":"已被发现","info.notDiscovered":"尚未被发现","info.nearAnts":"周围的蚂蚁","info.taken":"已搬走","info.entranceTitle":"{ent}与蚁丘","info.entranceDesc":"黑毛蚁把挖掘出的土粒堆在巢口周围，形成火山口状的小土丘。土丘能挡雨、吸收阳光为浅层育幼室加温。蚁穴通常有多个入口，便于通风和疏散。下雨前内务蚁会从里面用土粒把入口堵上，防止雨水灌进浅层房间，雨后地面晾干再清开。","info.sealed":"已用土粒封住","info.sealing":"封堵中 {n}%","info.open":"敞开","info.nearEntrance":"入口附近的蚂蚁","info.moundSoil":"土丘上的土粒","info.soilTotal":"累计挖出土粒","info.flyEntrance":"飞到入口","info.midden":"巢外垃圾堆","info.middenDesc":"工蚁把食物残渣、茧壳和同伴尸体集中堆放在巢外固定地点，远离育幼区，以降低病原体传播风险。负责搬运垃圾的工蚁通常不再回到育幼室工作。","info.removedTotal":"累计运出"},ke=(s,t,e)=>Number(s)===1?t:e,qs=s=>String(s).charAt(0).toUpperCase()+String(s).slice(1),Mi=s=>/^[aeiou]/i.test(String(s))?"an":"a",tg=s=>/water|juice|seeds/.test(String(s))?"some":Mi(s),eg={raw:"{s}","app.title":"Cyber Ant Farm","app.subtitle":"Black garden ant · Lasius niger","app.loading":"Generating the nest and foraging grounds…","time.stamp":"Day {day} {time}","role.queen":"queen","role.nurse":"nurse","role.maintenance":"maintenance worker","role.forager":"forager","role.scout":"scout","role.worker":"worker","roleDesc.queen":"The colony's only reproductive. After her mating flight she shed her wings and founded the nest alone, and she lays eggs for the rest of her life; the sperm stored from that one mating lasts more than a decade.","roleDesc.nurse":"Mostly young workers that emerged recently. They stay inside to care for eggs, larvae and pupae, feed the larvae and the queen, and help new ants out of their cocoons. As they age they gradually move on to work outside the nest.","roleDesc.maintenance":"Middle-aged workers. They dig and extend tunnels, carry waste and dead nestmates out of the nest, and guard and patrol the entrances.","roleDesc.forager":"The oldest workers, doing the riskiest work outside: searching for and carrying food, herding aphids, and laying a trail pheromone on the way home to recruit nestmates. Scouts are more inclined to explore unknown areas.","chamber.queen":"queen chamber","chamber.egg":"egg chamber","chamber.larva":"larva chamber","chamber.pupa":"pupa chamber","chamber.solar":"solar nursery","chamber.food":"food store","chamber.waste":"waste chamber","chamber.rest":"rest chamber","chamber.winter":"wintering chamber","chamber.numbered":"{name} {n}","chamberDesc.queen":"Home of the colony's only reproductive. A black garden ant queen can live for more than 20 years; nurses feed and clean her while she keeps laying eggs.","chamberDesc.egg":"Nurses gather the queen's eggs into clusters and keep licking them to keep them moist and stop mold.","chamberDesc.larva":"Larvae have no legs and depend entirely on nurses feeding them prey fragments and regurgitated liquid. What a larva eats decides how big it will be as an adult.","chamberDesc.pupa":"Fully grown black garden ant larvae spin a silk cocoon and pupate. Pupae prefer warm, dry conditions and are often moved to rooms near the surface during the day.","chamberDesc.solar":'A shallow room pressed right under a stone. The stone soaks up sunlight and heats quickly, so in the afternoon nurses move the pupae here to "sunbathe" and develop faster, then carry them back down when it cools at night.',"chamberDesc.food":`Temporary storage for prey fragments and seeds brought back by foragers. Liquid food such as honeydew is mostly stored in the workers' crops (the "social stomach").`,"chamberDesc.waste":"Food scraps, cocoon shells and droppings are piled here first, then carried by maintenance workers to the midden outside, which limits the spread of pathogens inside the nest.","chamberDesc.rest":'Workers with no current task gather here to rest. This "reserve labor force" is mobilized when the colony needs it.',"chamberDesc.winter":"The deepest part of the nest, with a stable temperature all year round. In autumn and winter the whole colony moves in here and goes dormant.","entrance.main":"main entrance","entrance.side":"side entrance","loc.surface":"surface","loc.shaft":"main shaft","loc.tunnel":"tunnel","loc.entrance":"entrance","place.nearEntrance":"beside the nest entrance","place.dir":"{d} cm {dir} of the nest","dir.0":"east","dir.1":"southeast","dir.2":"south","dir.3":"southwest","dir.4":"west","dir.5":"northwest","dir.6":"north","dir.7":"northeast","item.egg":"egg","item.larva":"larva","item.pupa":"pupa","item.food":"food","item.waste":"waste","item.soil":"soil pellet","item.corpse":"dead nestmate","foodKind.prey":"prey pieces","foodKind.seed":"seeds","foodKind.sugar":"sugary liquid","food.beetle":"beetle carcass","food.caterpillar":"caterpillar carcass","food.seeds":"seeds with elaiosomes","food.fruit":"fallen fruit juice","food.syrup":"sugar water","foodDesc.beetle":"Protein-rich prey. Foragers cut it into small pieces and carry them home, mainly to feed the larvae.","foodDesc.caterpillar":"Large, soft-bodied prey. It usually takes many foragers taking turns to cut it up and carry it away, which builds a clear pheromone trail.","foodDesc.seeds":'Seeds of violets and similar plants carry a fat-rich elaiosome that "hires" ants to disperse them. The ants eat the elaiosome and then discard the seed outside the nest.',"foodDesc.fruit":"A sugar-rich liquid food. Foragers suck the juice into their crops, bring it home, and share it with nestmates through trophallaxis.","foodDesc.syrup":'A drop of sugar water from you. Like honeydew and nectar, it is sucked into the crop and carried home; it is the most common "snack" for pet ants.',"predator.spider":"wolf spider","predator.antlion":"antlion","predatorDesc.spider":"A hunting spider of the family Lycosidae. It builds no web; it finds prey by sight and ground vibration and pounces with a sudden dash. Foragers on the surface are common prey. It injects venom, sucks out the body fluids and leaves an empty husk.","predatorDesc.antlion":"The larva of an antlion lacewing (Myrmeleontidae). Walking backwards, it digs a funnel-shaped pit in dry, loose ground and buries itself at the bottom with only its jaws showing. Ants that step on the pit wall slide down the loose sand, and the deeper they go the harder it is to climb out. Caught ants are sucked dry and the husks are flicked out of the pit.","spiderState.wander":"Wandering, looking for prey","spiderState.pause":"Crouched motionless, sensing vibrations","spiderState.chase":"Pouncing on an ant","spiderState.feed":"Feeding","spiderState.leave":"Full, leaving the area","obstacle.pebble":"pebble","obstacle.rock":"big rock","obstacle.twig":"twig barrier","weather.heavyRain":"Heavy rain","weather.lightRain":"Light rain","weather.overcast":"Clouding over","weather.afterRain":"After rain","weather.clear":"Clear","cause.age":"old age","cause.starve":"starvation","cause.spider":"eaten by a wolf spider","cause.mobbed":"bitten to death while mobbing a wolf spider","cause.antlion":"caught in an antlion pit","act.idle":"Standing by","act.dead":"Dead ({cause})","act.solicit":s=>`${qs(s.reason)}; begging food from #${s.id}`,"act.receiveShare":"Trophallaxis with #{id}: receiving regurgitated sugar","act.seekPartner":"Looking for a nestmate that needs food","act.approachShare":"Walking to #{id} to share food","act.giveShare":"Trophallaxis with #{id}: regurgitating sugar from its crop","act.unloadStore":"Entering the food store to share sugar with nestmates","act.shareIn":"Going to the {room} to share sugar","act.bringCrop":"Bringing suga
